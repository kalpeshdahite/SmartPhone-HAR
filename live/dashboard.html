<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Live HAR</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 12px}
#act{font-size:2.6rem;font-weight:700;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.9rem}
.name{width:90px}.bar{flex:1;background:#eee;height:12px;border-radius:6px}
.fill{background:#2a7;height:100%;border-radius:6px}
table{border-collapse:collapse}td{padding:2px 14px 2px 0;font-family:monospace}
</style></head><body>
<h2>Live activity recognition</h2>
<div id="act">waiting for data...</div>
<div id="conf"></div><div id="bars"></div>
<h3>Latest sensor values (dataset units: g, rad/s)</h3>
<table id="sens"></table>
<p id="buf"></p>
<script>
async function tick(){
  try{
    const s = await (await fetch('/state')).json();
    document.getElementById('act').textContent = s.activity ? s.activity.toUpperCase() : 'collecting a full window...';
    document.getElementById('conf').textContent = s.confidence != null ? 'Confidence: ' + (s.confidence*100).toFixed(1) + '%' : '';
    const bars = document.getElementById('bars'); bars.innerHTML = '';
    if (s.probs) for (const [n,p] of Object.entries(s.probs)) {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<span class="name"></span><div class="bar"><div class="fill"></div></div><span></span>';
      r.children[0].textContent = n; r.querySelector('.fill').style.width = (p*100)+'%';
      r.children[2].textContent = (p*100).toFixed(1)+'%'; bars.appendChild(r);
    }
    const t = document.getElementById('sens'); t.innerHTML = '';
    if (s.latest) for (const [k,v] of Object.entries(s.latest)) {
      const tr = document.createElement('tr'); tr.innerHTML = '<td></td><td></td>';
      tr.children[0].textContent = k; tr.children[1].textContent = v.toFixed(3); t.appendChild(tr);
    }
    document.getElementById('buf').textContent = 'Buffered: ' + s.buffer_s + ' s (needs about 3 s)';
  } catch(e) {}
}
setInterval(tick, 300);
</script></body></html>
